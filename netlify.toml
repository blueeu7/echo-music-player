# Netlify Configuration for Echo Music Player
# Optimized for pnpm workspace deployment

[build]
# Use pnpm instead of npm (required for monorepo)
command = "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run build"
# Output directory for the static site
publish = "artifacts/music-player/dist/public"
# Node.js version
node_version = "20"

# Environment variables (can be overridden in Netlify dashboard)
[build.environment]
NODE_ENV = "production"
# Ensure pnpm is used
NPM_FLAGS = "--legacy-peer-deps"
CI = "true"

# Rewrite rules for SPA (Single Page Application)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache configuration
[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Custom error page (optional)
[context.production.redirects]
status = 404
force = false
